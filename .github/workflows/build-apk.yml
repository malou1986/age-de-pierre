name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation en 1 clic depuis l'interface GitHub

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🔨 Build Vite web app
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🤖 Build Android APK (Debug / Standalone)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Prepare APK file for download
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Age-de-Pierre.apk

      - name: 🚀 Upload APK Artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: Age-de-Pierre-Android-APK
          path: release-output/Age-de-Pierre.apk
          retention-days: 30
